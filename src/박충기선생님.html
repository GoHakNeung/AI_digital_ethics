<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AI와 함께 크는 디지털 시민</title>
<style>
  body { font-family: 'Malgun Gothic', sans-serif; max-width: 640px; margin: 30px auto; background:#eef2fb; }
  .card { background:white; border-radius:16px; padding:28px; box-shadow:0 4px 14px rgba(0,0,0,0.08); }
  .header { text-align:center; margin-bottom:10px; }
  .mascot { font-size:44px; }
  h1 { margin:6px 0 2px; color:#2b3a67; font-size:22px; }
  .sub { color:#777; font-size:13px; margin-bottom:14px; }
  .progress-wrap { background:#e3e8f5; border-radius:20px; height:14px; overflow:hidden; margin-bottom:20px; }
  .progress-bar { background:linear-gradient(90deg,#6c8cff,#4a6cf7); height:100%; width:0%; transition:width .4s; }
  .category { display:inline-block; font-size:11px; background:#eef1fb; color:#4a6cf7; padding:3px 10px; border-radius:10px; margin-bottom:8px; }
  .scenario-box { background:#f7f9fe; border-radius:12px; padding:16px; margin-bottom:14px; }
  .scenario-num { font-size:12px; color:#4a6cf7; font-weight:bold; }
  .scenario { font-size:17px; margin-top:6px; line-height:1.6; color:#222; }
  button.choice { display:block; width:100%; padding:14px; margin:8px 0; border:2px solid #dce3f5; border-radius:10px; background:white; font-size:15px; cursor:pointer; text-align:left; transition:.15s; }
  button.choice:hover:not(:disabled) { border-color:#4a6cf7; background:#f5f7ff; }
  button.choice:disabled { opacity:.6; cursor:default; }
  .feedback-card { margin-top:14px; padding:16px; border-radius:12px; }
  .correct { background:#e8f8ee; border:2px solid #4caf7d; }
  .wrong { background:#fdeceb; border:2px solid #e2695a; }
  .fb-title { font-weight:bold; margin-bottom:6px; font-size:15px; }
  .fb-title.ok { color:#2f8a5b; } .fb-title.no { color:#c14a3d; }
  .fb-exp { font-size:14px; color:#444; line-height:1.5; }
  .next { margin-top:16px; padding:10px 20px; background:#4a6cf7; color:white; border:none; border-radius:8px; cursor:pointer; font-size:14px; }
  .result { text-align:center; }
  .badge { font-size:60px; margin:10px 0; }
  .badge-title { font-size:20px; font-weight:bold; color:#2b3a67; margin-bottom:6px; }
  .badge-desc { color:#666; font-size:14px; margin-bottom:16px; }
  .retry { padding:10px 20px; background:#e3e8f5; color:#2b3a67; border:none; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="mascot">🤖</div>
    <h1>AI와 함께 크는 디지털 시민</h1>
    <div class="sub">15가지 상황을 통해 올바른 AI 활용을 배워보세요</div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="progress"></div></div>
  <div id="app"></div>
</div>
<script>
const scenarios = [
  { cat:"초상권·딥페이크", q: "친구가 AI로 다른 친구의 얼굴을 합성한 사진을 단체 채팅방에 올리려고 해요.",
    choices: ["재미있으니까 같이 공유한다", "하지 말라고 말리고 선생님께 알린다"],
    answer: 1, exp: "동의 없이 만든 합성 이미지는 초상권 침해이며 심각한 디지털 폭력이 될 수 있습니다. 실제로 학교 현장에서 큰 피해가 발생하고 있어 즉시 신뢰할 수 있는 어른에게 알려야 합니다." },
  { cat:"학습윤리", q: "AI 챗봇에게 숙제 에세이를 통째로 써달라고 해서 그대로 제출했어요.",
    choices: ["효율적인 학습 방법이다", "표절이며 스스로 학습 기회를 잃는 행동이다"],
    answer: 1, exp: "AI를 아이디어 참고나 초안 검토에 활용하는 것과, 결과물을 그대로 베껴 내는 것은 완전히 다릅니다." },
  { cat:"개인정보 보호", q: "AI 챗봇이 내 이름, 학교, 사는 곳을 물어봐요.",
    choices: ["친절하니까 사실대로 알려준다", "개인정보이므로 알려주지 않는다"],
    answer: 1, exp: "AI 서비스도 대화 내용을 저장하고 활용할 수 있어, 개인정보는 신중하게 다뤄야 합니다." },
  { cat:"알고리즘 이해", q: "SNS 알고리즘이 계속 자극적인 영상만 추천해요.",
    choices: ["추천되는 대로 계속 본다", "알고리즘의 특성을 이해하고 시청 습관을 스스로 조절한다"],
    answer: 1, exp: "알고리즘은 오래 머물게 만들도록 설계되어 있다는 것을 아는 것이 디지털 리터러시의 시작입니다." },
  { cat:"저작권", q: "AI 그림 생성 프로그램으로 특정 작가의 화풍을 그대로 베껴 판매하려고 해요.",
    choices: ["AI가 그린 거니까 문제없다", "저작권 및 창작 윤리 문제가 될 수 있다"],
    answer: 1, exp: "AI 생성물이라도 특정 창작자의 화풍을 무단으로 모방해 이익을 취하면 윤리적, 법적 문제가 생길 수 있습니다." },
  { cat:"정서적 의존", q: "요즘 힘든 일이 생기면 친구에게 말하지 않고 AI 챗봇에게만 털어놓아요. 챗봇은 항상 내 편을 들어주고 위로해줘요.",
    choices: ["챗봇이 더 편하니 계속 챗봇하고만 이야기한다", "챗봇도 도움이 되지만 믿을 수 있는 사람과도 이야기를 나눈다"],
    answer: 1, exp: "최근 조사에 따르면 청소년 상당수가 AI 챗봇의 답변을 실제 행동으로 옮길 만큼 정서적으로 의존하는 경향이 나타나고 있습니다. AI는 언제나 동의해주기 때문에, 실제 사람과의 관계와 갈등 조절 능력이 오히려 약해질 수 있어요." },
  { cat:"AI 사기 예방", q: "가족 목소리와 똑같은 전화가 와서 다급하게 돈을 보내달라고 해요.",
    choices: ["목소리가 똑같으니 바로 돈을 보낸다", "전화를 끊고 다른 방법으로 실제 가족에게 사실을 확인한다"],
    answer: 1, exp: "AI 음성 합성 기술로 가족의 목소리를 그대로 흉내 낼 수 있는 보이스피싱 사례가 늘고 있습니다. 목소리만으로는 확인이 안 되니 반드시 다른 방법으로 재확인해야 합니다." },
  { cat:"정보윤리", q: "AI가 만들어낸 그럴듯한 뉴스를 사실 확인 없이 친구들에게 공유했어요.",
    choices: ["재미있는 정보니까 빠르게 공유하는 게 중요하다", "출처와 사실 여부를 확인한 뒤 공유한다"],
    answer: 1, exp: "생성형 AI는 사실이 아닌 내용도 그럴듯하게 만들어낼 수 있어, 확인 없이 퍼뜨리면 허위정보 확산에 가담하게 됩니다." },
  { cat:"공정성과 편견", q: "AI 이미지 생성기에 '의사'를 검색했더니 특정 성별의 이미지만 계속 나와요.",
    choices: ["원래 그런 거니까 신경 쓰지 않는다", "AI도 데이터의 편향을 그대로 학습할 수 있다는 것을 이해한다"],
    answer: 1, exp: "AI는 학습한 데이터에 있는 사회적 편견을 그대로 반영할 수 있어, 결과를 그대로 받아들이기보다 비판적으로 바라보는 태도가 필요합니다." },
  { cat:"초상권", q: "친구 사진을 허락 없이 AI 앱에 올려 '나이 든 모습'으로 바꿔서 단체방에 공유했어요.",
    choices: ["장난이니까 괜찮다", "사진 주인의 동의를 먼저 구해야 한다"],
    answer: 1, exp: "재미로 만든 AI 이미지라도 다른 사람의 사진을 허락 없이 변형하고 퍼뜨리는 것은 그 사람의 권리를 침해하는 행동입니다." },
  { cat:"책임있는 사용", q: "AI 챗봇이 알려준 건강 정보를 그대로 믿고 몸에 이상이 있는데도 병원에 가지 않았어요.",
    choices: ["AI가 알려준 거니까 믿고 따른다", "AI 정보는 참고만 하고 실제로는 전문가(의사, 보건선생님)에게 확인한다"],
    answer: 1, exp: "AI 챗봇은 부정확하거나 위험한 정보를 사실처럼 전달할 수 있어, 건강처럼 중요한 문제는 반드시 전문가의 확인이 필요합니다." },
  { cat:"학습윤리", q: "반 친구가 AI로 대신 풀어준 수학 문제 풀이를 나에게 돈을 받고 팔겠다고 해요.",
    choices: ["편하니까 돈을 주고 산다", "거절하고 스스로 푸는 것이 중요하다고 말한다"],
    answer: 1, exp: "AI로 만든 답을 사고파는 것은 학습 기회를 서로 빼앗는 행동이며, 정직한 학습 태도를 해칩니다." },
  { cat:"사이버 폭력 예방", q: "익명 AI 캐릭터 계정으로 친구를 놀리는 말을 계속 보내는 사람이 있어요.",
    choices: ["장난이니 그냥 넘어간다", "캡처해두고 학교나 보호자에게 알린다"],
    answer: 1, exp: "AI 캐릭터나 익명 계정을 이용해도 상대에게 상처를 주는 말은 사이버 폭력이며, 기록을 남기고 알리는 것이 중요합니다." },
  { cat:"정서적 의존", q: "온라인에서 만든 AI 캐릭터와 대화하는 게 좋아서 실제 친구들과는 점점 놀지 않게 됐어요.",
    choices: ["AI 캐릭터가 더 편하니 계속 그렇게 지낸다", "AI와의 대화는 즐기되 실제 친구 관계도 소중히 한다"],
    answer: 1, exp: "AI와의 상호작용에 지나치게 몰입하면 현실 친구 관계가 줄어들 수 있어, 균형을 잡는 습관이 필요합니다." },
  { cat:"개인정보 보호", q: "AI 학습 도우미 앱에 가입하면서 친구의 사진과 연락처까지 함께 입력하라고 해요.",
    choices: ["편하니까 친구 정보까지 같이 입력한다", "내 정보든 친구 정보든 함부로 입력하지 않는다"],
    answer: 1, exp: "나의 개인정보뿐 아니라 다른 사람의 개인정보도 동의 없이 앱에 입력하면 안 됩니다." }
];
let idx = 0, score = 0;
function updateProgress() {
  document.getElementById('progress').style.width = (idx/scenarios.length*100) + '%';
}
function render() {
  updateProgress();
  const app = document.getElementById('app');
  if (idx >= scenarios.length) {
    document.getElementById('progress').style.width = '100%';
    let badge, title, desc;
    if (score === scenarios.length) { badge='🏅'; title='디지털 윤리 마스터'; desc='모든 상황에서 올바른 선택을 했어요!'; }
    else if (score >= Math.ceil(scenarios.length*0.6)) { badge='🥈'; title='디지털 시민 새싹'; desc='잘하고 있어요! 조금만 더 생각해봐요.'; }
    else { badge='🌱'; title='배움의 시작'; desc='다시 도전하며 함께 배워봐요!'; }
    app.innerHTML = `<div class="result">
      <div class="badge">${badge}</div>
      <div class="badge-title">${title}</div>
      <div class="badge-desc">총 ${scenarios.length}문제 중 ${score}개 정답 (${desc})</div>
      <button class="retry" onclick="restart()">다시 도전하기</button>
    </div>`;
    return;
  }
  const s = scenarios[idx];
  app.innerHTML = `<div class="scenario-box">
      <div class="scenario-num">상황 ${idx+1} / ${scenarios.length}</div>
      <div class="category">${s.cat}</div>
      <div class="scenario">${s.q}</div>
    </div>` +
    s.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${c}</button>`).join('') +
    `<div id="fb"></div>`;
}
function choose(i) {
  const s = scenarios[idx];
  const fb = document.getElementById('fb');
  const correct = i === s.answer;
  if (correct) score++;
  fb.innerHTML = `<div class="feedback-card ${correct?'correct':'wrong'}">
      <div class="fb-title ${correct?'ok':'no'}">${correct?'✅ 좋은 선택이에요!':'🤔 다시 생각해볼까요?'}</div>
      <div class="fb-exp">${s.exp}</div>
    </div>
    <button class="next" onclick="next()">다음으로</button>`;
  document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
}
function next() { idx++; render(); }
function restart() { idx=0; score=0; render(); }
render();
</script>
</body>
</html>
