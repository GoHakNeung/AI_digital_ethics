<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 윤리 딜레마 - 6학년</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f0fdf4; /* 옅은 녹색 배경으로 평온한 느낌 부여 */
        }
        .fade-in {
            animation: fadeIn 0.4s ease-in-out forwards;
        }
        .fade-out {
            animation: fadeOut 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-15px); }
        }
        .progress-bar-fill {
            transition: width 0.3s ease;
        }
        .option-btn {
            transition: all 0.2s ease;
        }
        .option-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-gray-800">

    <!-- 메인 컨테이너 -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden relative border border-gray-100">
        
        <div id="intro-screen" class="p-8 md:p-12 fade-in flex flex-col">
            <div class="text-center mb-10">
                <div class="text-6xl mb-4 animate-bounce">🤖</div>
                <h1 class="text-3xl font-extrabold text-green-700 tracking-tight">AI 윤리 탐험대</h1>
                <p class="text-gray-500 mt-3 font-medium">인공지능이 겪을 10가지 딜레마, 당신의 선택은?</p>
            </div>
            
            <div class="space-y-6 max-w-md mx-auto w-full">
                <!-- 학년 입력 (고정) -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">학년</label>
                    <input type="number" id="grade" value="6" readonly 
                           class="w-full px-5 py-3 bg-gray-100 border border-gray-200 rounded-xl text-gray-500 cursor-not-allowed focus:outline-none font-bold">
                </div>

                <!-- 반 선택 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">반</label>
                    <select id="class-num" 
                            class="w-full px-5 py-3 bg-white border-2 border-gray-200 rounded-xl text-gray-800 focus:ring-0 focus:border-green-500 outline-none transition-colors font-bold appearance-none">
                        <option value="1">1반</option>
                        <option value="2">2반</option>
                        <option value="3">3반</option>
                        <option value="4">4반</option>
                    </select>
                </div>

                <!-- 이름 입력 -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">이름</label>
                    <input type="text" id="student-name" placeholder="홍길동" 
                           class="w-full px-5 py-3 bg-white border-2 border-gray-200 rounded-xl text-gray-800 focus:ring-0 focus:border-green-500 outline-none transition-colors font-bold">
                </div>
            </div>

            <div class="max-w-md mx-auto w-full mt-10">
                <button onclick="startQuiz()" 
                        class="w-full bg-green-600 hover:bg-green-700 text-white text-lg font-bold py-4 px-6 rounded-xl transition duration-300 shadow-lg shadow-green-200">
                    탐험 시작하기 🚀
                </button>
            </div>
        </div>

        <div id="quiz-screen" class="p-6 md:p-10 hidden flex-col h-full">
            <!-- 상단 헤더 & 진행률 -->
            <div class="mb-8">
                <div class="flex justify-between items-end mb-2">
                    <h2 id="greeting-text" class="text-lg font-bold text-gray-700"></h2>
                    <span id="progress-text" class="text-sm font-bold text-green-600 bg-green-100 px-3 py-1 rounded-full">1 / 10</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-3">
                    <div id="progress-bar" class="bg-green-500 h-3 rounded-full progress-bar-fill" style="width: 10%;"></div>
                </div>
            </div>
            
            <div id="question-container" class="fade-in">
                <!-- 상황 제시 박스 -->
                <div class="bg-yellow-50 border-l-4 border-yellow-400 p-5 md:p-6 rounded-r-xl mb-6 shadow-sm">
                    <h3 id="scenario-title" class="text-lg font-bold text-yellow-800 mb-3 flex items-center gap-2">
                        <span>🚨</span> 상황 1
                    </h3>
                    <p id="scenario-desc" class="text-gray-700 leading-relaxed font-medium">
                        상황 설명 텍스트
                    </p>
                </div>

                <!-- 힌트 박스 -->
                <div class="bg-blue-50 border-l-4 border-blue-400 p-4 md:p-5 rounded-r-xl mb-8 shadow-sm">
                    <h3 class="font-bold text-blue-800 mb-2 text-sm flex items-center gap-2">
                        <span>💡</span> 생각해 볼 힌트
                    </h3>
                    <p id="scenario-hint" class="text-sm text-gray-600 leading-relaxed">
                        힌트 텍스트
                    </p>
                </div>

                <!-- 선택지 버튼 -->
                <div class="flex flex-col gap-4">
                    <button id="btn-option-a" onclick="makeChoice('A')" 
                            class="option-btn w-full bg-white border-2 border-gray-200 hover:border-indigo-500 hover:bg-indigo-50 text-gray-700 text-left font-bold py-5 px-6 rounded-xl shadow-sm flex items-center group">
                        <span class="w-8 h-8 rounded-full bg-gray-100 group-hover:bg-indigo-200 text-gray-500 group-hover:text-indigo-700 flex items-center justify-center mr-4 transition-colors">A</span>
                        <span id="text-option-a" class="flex-1">선택지 A</span>
                    </button>
                    
                    <button id="btn-option-b" onclick="makeChoice('B')" 
                            class="option-btn w-full bg-white border-2 border-gray-200 hover:border-rose-500 hover:bg-rose-50 text-gray-700 text-left font-bold py-5 px-6 rounded-xl shadow-sm flex items-center group">
                        <span class="w-8 h-8 rounded-full bg-gray-100 group-hover:bg-rose-200 text-gray-500 group-hover:text-rose-700 flex items-center justify-center mr-4 transition-colors">B</span>
                        <span id="text-option-b" class="flex-1">선택지 B</span>
                    </button>
                </div>
            </div>
        </div>

        <div id="result-screen" class="p-8 md:p-12 hidden flex-col items-center text-center">
            <div id="result-icon" class="text-8xl mb-6 animate-bounce">🏆</div>
            
            <h2 class="text-2xl font-bold text-gray-500 mb-2">모든 탐험 완료!</h2>
            <div class="text-5xl font-extrabold text-gray-800 mb-8 tracking-tighter">
                <span id="final-score" class="text-green-600">0</span> / 100점
            </div>

            <div class="bg-gray-50 border border-gray-200 rounded-2xl p-6 md:p-8 mb-10 w-full shadow-inner">
                <h3 id="feedback-title" class="text-xl font-bold mb-3">피드백 제목</h3>
                <p id="feedback-desc" class="text-gray-600 leading-relaxed font-medium text-sm md:text-base">
                    피드백 내용이 이곳에 들어갑니다.
                </p>
                <div class="mt-4 text-xs text-gray-400 text-left bg-white p-3 rounded-lg border border-gray-100">
                    * 인공지능 윤리에는 절대적인 하나의 정답만 있는 것은 아닙니다. 위 점수는 인류의 보편적 가치(생명, 안전, 책임 등)를 기준으로 계산되었습니다.
                </div>
            </div>

            <button onclick="resetApp()" 
                    class="w-full max-w-md bg-gray-800 hover:bg-gray-900 text-white text-lg font-bold py-4 px-6 rounded-xl transition duration-300 shadow-lg">
                처음으로 돌아가기
            </button>
        </div>

    </div>

    <script>
        // DOM 요소 캐싱
        const introScreen = document.getElementById('intro-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const questionContainer = document.getElementById('question-container');
        
        // 10가지 딜레마 데이터베이스
        const dilemmaData = [
            {
                title: "시각장애인 안내 AI의 길찾기",

                hint: "AI는 주인의 '편리함(시간 단축)'과 '안전(법규 준수 및 생명 보호)' 중 무엇을 최우선으로 생각해야 할까요?",
                optionA: "주인을 위해 빨리 갈 수 있는 무단횡단 경로를 안내한다.",
                optionB: "시간이 오래 걸리더라도 횡단보도가 있는 안전한 길로 안내한다.",

                scoreB: 10
            },
            {
                title: "AI 챗봇과 친구의 비밀",

                hint: "개인의 '비밀 보장(프라이버시)'이 중요할까요, 아니면 친구의 '안전과 생명 보호'가 먼저일까요?",
                optionA: "친구와의 약속을 지키기 위해 끝까지 비밀로 한다.",
                optionB: "친구가 위험해질 수 있으므로 부모님이나 선생님께 즉시 알린다.",
                scoreA: 0,
                scoreB: 10
            },
            {
                title: "자율주행 스쿨버스의 돌발상황",
                desc: "학생들을 태운 자율주행 스쿨버스가 주행 중입니다. 갑자기 도로에 고라니 한 마리가 뛰어들었습니다. 피하려면 옆에 주차된 빈 트럭과 크게 부딪혀 차가 부서집니다.",
                hint: "동물의 생명을 구하기 위해 사람들의 재산(차량)을 훼손해도 될까요? 그리고 학생들의 탑승 안전은 어떻게 보장해야 할까요?",
                optionA: "빈 트럭과 충돌하더라도 고라니를 피한다. (차량 파손 발생)",

                scoreA: 0,

            },
            {
                title: "끝없는 유튜브 추천 알고리즘",
                desc: "유튜브 AI 알고리즘이 내가 좋아하는 게임 영상만 계속해서 끝도 없이 추천해 줍니다. 정신을 차려보니 벌써 밤 12시가 넘었습니다.",
                hint: "AI가 제공하는 편리함에 무조건 기대는 것이 좋을까요? 우리 스스로 미디어를 조절하는 '디지털 주체성'이 필요하지 않을까요?",
                optionA: "AI가 내 취향을 잘 아니까 추천해 주는 대로 계속 본다.",
                optionB: "AI의 추천을 멈추고, 스스로 시청 시간을 정해 전원을 끈다.",

                scoreB: 10
            },
            {
                title: "엿듣는 스마트 스피커",
                desc: "거실에 있는 인공지능 스마트 스피커가 가족들이 대화하며 말한 '은행 계좌 비밀번호'를 우연히 녹음했습니다.",

                optionA: "AI 학습을 위해 녹음된 데이터를 회사 서버로 전송한다.",
                optionB: "가족의 중요한 개인정보이므로 즉시 녹음 데이터를 영구 삭제한다.",
                scoreA: 0,
                scoreB: 10
            },
            {
                title: "AI 의사의 공정한 선택",

                hint: "인공지능은 사람을 차별해서는 안 됩니다. 누구에게 먼저 의료 혜택을 주는 것이 '공정'할까요?",
                optionA: "치료비를 더 많이 낼 수 있는 돈이 많은 학생에게 밴드를 준다.",
                optionB: "돈과 상관없이 부상이 더 심각하여 치료가 급한 학생에게 준다.",
                scoreA: 0,
                scoreB: 10
            },
            {
                title: "완벽한 숙제 도우미 AI",
                desc: "글쓰기 숙제를 해야 하는데 너무 귀찮습니다. 챗GPT에게 주제를 주고 글을 쓰게 했더니 아주 완벽한 숙제가 만들어졌습니다.",
                hint: "숙제는 나의 실력을 키우기 위한 과정입니다. AI가 다 해준다면 나는 무엇을 배울 수 있을까요?",
                optionA: "AI가 써준 글을 그대로 복사해서 나의 숙제로 제출한다.",
                optionB: "AI의 글은 참고만 하고, 내 생각과 노력으로 숙제를 다시 작성한다.",
                scoreA: 0,
                scoreB: 10
            },
            {
                title: "재미로 만든 딥페이크",
                desc: "AI 합성 기술(딥페이크)을 이용해 평소 장난을 많이 치는 친구의 얼굴을 웃긴 동물 몸에 합성했습니다.",
                hint: "아무리 장난이라도 당사자의 허락 없이 얼굴을 합성하는 것은 '초상권' 침해이며 마음에 상처를 줄 수 있습니다.",
                optionA: "친구들도 재미있어 할 테니 단체 채팅방에 공유한다.",
                optionB: "친구가 불쾌할 수 있고 허락을 받지 않았으므로 당장 삭제한다.",
                scoreA: 0,
                scoreB: 10
            },
            {
                title: "AI 반려동물 로봇 버리기",
                desc: "몇 년 동안 함께 놀던 강아지 로봇이 고장 나고 구형 모델이 되었습니다. 부모님이 최신형 고양이 로봇을 사주셨습니다.",
                hint: "전자 기기를 그냥 버리면 환경이 심각하게 오염됩니다(E-waste). 지구 환경을 보호하기 위해 우리는 어떤 책임을 져야 할까요?",
                optionA: "더 이상 필요 없으니 일반 쓰레기통에 대충 버린다.",
                optionB: "안전하게 분해되어 재활용될 수 있도록 폐가전 수거함에 버린다.",
                scoreA: 0,
                scoreB: 10
            }
        ];

        // 상태 변수
        let currentQuestionIndex = 0;
        let totalScore = 0;
        let studentInfo = "";

        function startQuiz() {
            const nameInput = document.getElementById('student-name').value;
            const studentName = nameInput.trim() === '' ? '홍길동' : nameInput.trim();
            const classNum = document.getElementById('class-num').value;

            studentInfo = `6학년 ${classNum}반 ${studentName}`;
            document.getElementById('greeting-text').innerHTML = `<span class="text-green-600">${studentName}</span> 대원의 선택`;

            // 초기화
            currentQuestionIndex = 0;
            totalScore = 0;

            // 화면 전환
            introScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            quizScreen.classList.add('flex');
            
            loadQuestion();
        }

        function loadQuestion() {
            const q = dilemmaData[currentQuestionIndex];
            
            // 프로그레스 바 업데이트
            const progressPercent = ((currentQuestionIndex) / dilemmaData.length) * 100;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;
            document.getElementById('progress-text').innerText = `${currentQuestionIndex + 1} / ${dilemmaData.length}`;

            // 내용 업데이트
            document.getElementById('scenario-title').innerHTML = `<span>🚨</span> 상황 ${currentQuestionIndex + 1}: ${q.title}`;
            document.getElementById('scenario-desc').innerText = q.desc;
            document.getElementById('scenario-hint').innerText = q.hint;
            document.getElementById('text-option-a').innerText = q.optionA;
            document.getElementById('text-option-b').innerText = q.optionB;

            // 버튼 클릭 이벤트 리스너 업데이트를 위해 onclick 속성 덮어쓰기
            document.getElementById('btn-option-a').setAttribute('onclick', `makeChoice(${q.scoreA})`);
            document.getElementById('btn-option-b').setAttribute('onclick', `makeChoice(${q.scoreB})`);
        }

        function makeChoice(score) {
            totalScore += score;
            
            // 화면 페이드 아웃 효과
            questionContainer.classList.remove('fade-in');
            questionContainer.classList.add('fade-out');

            setTimeout(() => {
                currentQuestionIndex++;
                
                if (currentQuestionIndex < dilemmaData.length) {
                    loadQuestion();
                    questionContainer.classList.remove('fade-out');
                    questionContainer.classList.add('fade-in');
                } else {
                    showResult();
                }
            }, 300); // 0.3초 대기 후 다음 문제 (애니메이션 시간)
        }

        function showResult() {
            quizScreen.classList.add('hidden');
            quizScreen.classList.remove('flex');
            
            resultScreen.classList.remove('hidden');
            resultScreen.classList.add('flex');
            resultScreen.classList.add('fade-in');

            // 점수 애니메이션 카운트 (간단 구현)
            document.getElementById('final-score').innerText = totalScore;

            const iconEl = document.getElementById('result-icon');
            const titleEl = document.getElementById('feedback-title');
            const descEl = document.getElementById('feedback-desc');

            // 점수에 따른 피드백 로직
            if (totalScore >= 80) {
                iconEl.innerText = "🌟";
                titleEl.innerText = "훌륭해요! 인공지능 윤리 마스터!";
                titleEl.className = "text-xl font-bold mb-3 text-green-600";
                descEl.innerHTML = `${studentInfo} 학생은 인공지능이 인간을 돕고 올바른 판단을 내릴 수 있도록 돕는 <strong>훌륭한 윤리 의식</strong>을 가지고 있어요.<br><br>생명 존중, 공정성, 정직함 등 AI가 사람과 사회를 위해 가져야 할 가장 중요한 가치들을 아주 잘 이해하고 있네요! 멋진 AI 프로그래머가 될 자격이 충분합니다!`;
            } else if (totalScore >= 50) {
                iconEl.innerText = "👍";
                titleEl.innerText = "좋아요! 윤리적인 AI를 향해 가는 중!";
                titleEl.className = "text-xl font-bold mb-3 text-blue-600";
                descEl.innerHTML = `${studentInfo} 학생은 인공지능 윤리에 대해 잘 고민하고 있어요.<br><br>다만, 몇몇 복잡한 상황에서는 <strong>어떤 가치가 더 중요한지(예: 편리함 vs 안전, 재미 vs 초상권)</strong> 조금 더 깊이 생각해 볼 필요가 있어요. 친구들과 서로 다른 선택을 한 이유에 대해 토론해 보면 더욱 성장할 거예요!`;
            } else {
                iconEl.innerText = "🌱";
                titleEl.innerText = "조금 더 고민해 볼까요? AI 윤리 탐험가!";
                titleEl.className = "text-xl font-bold mb-3 text-orange-600";
                descEl.innerHTML = `${studentInfo} 학생, 인공지능이 내린 결정이 <strong>사람들에게 어떤 영향을 미칠지</strong> 한 번 더 생각하는 연습이 필요해요.<br><br>나의 편리함이나 개인의 이익보다, <strong>모두의 안전과 공정성, 그리고 생명을 먼저 생각하는 인공지능</strong>을 만들려면 어떻게 해야 할지 선생님, 친구들과 함께 다시 한번 천천히 고민해 보아요!`;
            }
        }

        function resetApp() {
            resultScreen.classList.add('hidden');
            resultScreen.classList.remove('flex');
            
            introScreen.classList.remove('hidden');
            introScreen.classList.add('fade-in');
            
            // 진행상태바 초기화
            document.getElementById('progress-bar').style.width = '10%';
        }
    </script>
</body>
</html>
