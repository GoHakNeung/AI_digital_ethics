<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 윤리 딜레마 투표</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', -apple-system, sans-serif; background-color: #f4f7fa; color: #2c3e50; line-height: 1.6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background-color: #ffffff; width: 100%; max-width: 800px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08); padding: 50px; text-align: center; }
        
        h1 { color: #1a56db; margin-bottom: 20px; font-size: 28px; }
        p.description { margin-bottom: 40px; font-size: 18px; color: #5c6c7c; word-break: keep-all; font-weight: 500; }

        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* 선택지 박스 스타일 및 호버(기울어짐) 효과 */
        .cards-container { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; }
        @media(max-width: 600px) { .cards-container { flex-direction: column; } }
        
        .choice-card { 
            flex: 1; 
            padding: 40px 20px; 
            background: #ffffff; 
            border: 2px solid #e2e8f0; 
            border-radius: 16px; 
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .choice-card h2 { font-size: 22px; color: #1a56db; margin-bottom: 15px; pointer-events: none; }
        .choice-card p { font-size: 16px; color: #334155; pointer-events: none; word-break: keep-all; }

        /* 왼쪽 카드 마우스 오버 시: 왼쪽으로 약간 기울어짐 */
        .choice-card:nth-child(1):hover { 
            transform: rotate(-3deg) scale(1.05); 
            border-color: #1a56db; 
            background-color: #f8fafc;
            box-shadow: -5px 15px 25px rgba(26, 86, 219, 0.15); 
        }
        /* 오른쪽 카드 마우스 오버 시: 오른쪽으로 약간 기울어짐 */
        .choice-card:nth-child(2):hover { 
            transform: rotate(3deg) scale(1.05); 
            border-color: #ef4444; 
            background-color: #fff1f2;
            box-shadow: 5px 15px 25px rgba(239, 68, 68, 0.15); 
        }
        .choice-card:nth-child(2) h2 { color: #ef4444; }

        /* 대시보드 스타일 */
        .dashboard-item { text-align: left; margin-bottom: 30px; background: #f8fafc; padding: 20px; border-radius: 12px; }
        .dashboard-item h3 { font-size: 18px; margin-bottom: 15px; color: #1e293b; }
        
        .bar-container { display: flex; align-items: center; margin-bottom: 10px; }
        .bar-label { width: 80px; font-weight: bold; font-size: 14px; }
        .bar-track { flex: 1; background: #e2e8f0; height: 24px; border-radius: 12px; overflow: hidden; margin: 0 15px; position: relative; }
        .bar-fill { height: 100%; display: flex; align-items: center; padding-left: 10px; color: white; font-weight: bold; font-size: 12px; transition: width 1s ease-out; }
        .bar-fill.blue { background: #1a56db; }
        .bar-fill.red { background: #ef4444; }
        .bar-count { width: 50px; font-weight: bold; text-align: right; }

        .btn-reset { margin-top: 20px; padding: 12px 24px; background: #94a3b8; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 15px;}
        .btn-reset:hover { background: #64748b; }
        .btn-home { margin-top: 20px; padding: 12px 24px; background: #1a56db; color: white; border: none; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 15px; margin-left: 10px;}
        .btn-home:hover { background: #1545b3; }

        .total-voters { font-size: 16px; color: #64748b; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. 딜레마 퀴즈 섹션 -->
        <div id="quiz-section" class="section active">
            <div style="font-size: 14px; font-weight: bold; color: #94a3b8; margin-bottom: 10px;" id="question-counter">질문 1 / 3</div>
            <h1 id="question-title">AI 윤리 딜레마</h1>
            <p id="question-desc" class="description">상황 설명이 여기에 표시됩니다.</p>
            
            <div class="cards-container">
                <div class="choice-card" onclick="selectOption('A')">
                    <h2>선택지 A</h2>
                    <p id="text-a">내용 A</p>
                </div>
                <div class="choice-card" onclick="selectOption('B')">
                    <h2>선택지 B</h2>
                    <p id="text-b">내용 B</p>
                </div>
            </div>
        </div>

        <!-- 2. 대시보드 섹션 -->
        <div id="dashboard-section" class="section">
            <h1>📊 투표 결과 대시보드</h1>
            <p class="total-voters">현재까지 총 <strong id="total-users" style="color:#1a56db; font-size:20px;">0</strong>명이 참여했습니다.</p>
            
            <div id="dashboard-content">
                <!-- 자바스크립트로 결과 그래프가 여기에 생성됩니다 -->
            </div>

            <button class="btn-reset" onclick="resetData()">데이터 초기화</button>
            <button class="btn-home" onclick="goHome()">처음으로 (다음 사람 투표)</button>
        </div>
    </div>

    <script>
        // 질문 데이터
        const questions = [
            {
                title: "상황 1: 자율주행차의 딜레마",
                desc: "브레이크가 고장 난 자율주행차에 당신이 타고 있습니다. 직진하면 보행자 3명이 다치고, 방향을 틀면 벽에 부딪혀 탑승자인 당신 1명이 위험해집니다.",
                a: "방향을 틀어 보행자 3명을 살린다.",
                b: "직진하여 탑승자인 나를 보호한다."
            },
            {
                title: "상황 2: AI 창작물의 저작권",
                desc: "AI에게 유명 화가의 화풍을 학습시켜 만든 그림이 미술 대회에서 1등 상금을 받았습니다. 이 상금의 진짜 주인은 누구일까요?",
                a: "프롬프트를 입력하고 기획한 '사용자'",
                b: "원본 화풍 데이터를 제공한 '원작 화가들'"
            },
            {
                title: "상황 3: 빅데이터와 프라이버시",
                desc: "범죄율 0%를 위해 도시의 모든 CCTV에 AI 안면인식 기술을 도입하려 합니다. 범죄자는 즉시 잡을 수 있지만, 시민들의 모든 이동 경로가 24시간 기록됩니다.",
                a: "범죄 없는 안전을 위해 시스템을 도입한다.",
                b: "사생활 보호가 중요하므로 도입을 반대한다."
            }
        ];

        let currentQuestion = 0;

        // 투표 데이터 불러오기 (로컬 스토리지)
        // 데이터가 없으면 초기값 설정
        let voteData = JSON.parse(localStorage.getItem('aiDilemmaVotes')) || [
            { a: 0, b: 0 }, // 1번 질문 데이터
            { a: 0, b: 0 }, // 2번 질문 데이터
            { a: 0, b: 0 }  // 3번 질문 데이터
        ];

        // 질문 화면 업데이트
        function loadQuestion() {
            if (currentQuestion < questions.length) {
                document.getElementById('question-counter').innerText = `질문 ${currentQuestion + 1} / ${questions.length}`;
                document.getElementById('question-title').innerText = questions[currentQuestion].title;
                document.getElementById('question-desc').innerText = questions[currentQuestion].desc;
                document.getElementById('text-a').innerText = questions[currentQuestion].a;
                document.getElementById('text-b').innerText = questions[currentQuestion].b;
            } else {
                showDashboard();
            }
        }

        // 선택지 클릭 시 데이터 저장 및 다음 질문으로
        function selectOption(choice) {
            if(choice === 'A') {
                voteData[currentQuestion].a++;
            } else {
                voteData[currentQuestion].b++;
            }
            
            // 로컬 스토리지에 데이터 저장
            localStorage.setItem('aiDilemmaVotes', JSON.stringify(voteData));

            currentQuestion++;
            loadQuestion();
        }

        // 대시보드 표시 함수
        function showDashboard() {
            document.getElementById('quiz-section').classList.remove('active');
            document.getElementById('dashboard-section').classList.add('active');

            const contentDiv = document.getElementById('dashboard-content');
            contentDiv.innerHTML = ''; // 기존 내용 초기화

            // 총 참여자 수 계산 (1번 질문 응답자 수 기준)
            const totalParticipants = voteData[0].a + voteData[0].b;
            document.getElementById('total-users').innerText = totalParticipants;

            // 각 질문별 그래프 생성
            questions.forEach((q, index) => {
                const votesA = voteData[index].a;
                const votesB = voteData[index].b;
                const total = votesA + votesB;
                
                // 퍼센트 계산 (0으로 나누기 방지)
                const percentA = total === 0 ? 0 : Math.round((votesA / total) * 100);
                const percentB = total === 0 ? 0 : Math.round((votesB / total) * 100);

                const itemHtml = `
                    <div class="dashboard-item">
                        <h3>${q.title}</h3>
                        
                        <div class="bar-container">
                            <div class="bar-label" style="color:#1a56db;">선택 A</div>
                            <div class="bar-track">
                                <div class="bar-fill blue" style="width: ${percentA}%">${percentA}%</div>
                            </div>
                            <div class="bar-count">${votesA}명</div>
                        </div>

                        <div class="bar-container">
                            <div class="bar-label" style="color:#ef4444;">선택 B</div>
                            <div class="bar-track">
                                <div class="bar-fill red" style="width: ${percentB}%">${percentB}%</div>
                            </div>
                            <div class="bar-count">${votesB}명</div>
                        </div>
                    </div>
                `;
                contentDiv.insertAdjacentHTML('beforeend', itemHtml);
            });
        }

        // 처음으로 돌아가기 (다음 학생 투표용)
        function goHome() {
            currentQuestion = 0;
            document.getElementById('dashboard-section').classList.remove('active');
            document.getElementById('quiz-section').classList.add('active');
            loadQuestion();
        }

        // 데이터 초기화 기능
        function resetData() {
            if(confirm("모든 투표 기록을 지우시겠습니까?")) {
                voteData = [ { a: 0, b: 0 }, { a: 0, b: 0 }, { a: 0, b: 0 } ];
                localStorage.setItem('aiDilemmaVotes', JSON.stringify(voteData));
                showDashboard(); // 화면 갱신
            }
        }

        // 초기 실행
        loadQuestion();
    </script>
</body>
</html>
